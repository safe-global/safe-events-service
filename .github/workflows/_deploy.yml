name: _deploy
on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      image:
        description: Image tag and digest, e.g. v1.6.0@sha256:...
        type: string
        required: true
      values_file:
        type: string
        required: true
      base_url:
        description: Public URL prefix of the service, e.g. https://api.safe.global/internal/events
        type: string
        required: true
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

permissions: {}

jobs:
  deploy:
    permissions: {}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check the image reference
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^(main-[0-9a-f]{7}|v[0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Refusing to deploy '${IMAGE}'"; exit 1; }

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: safe-global
          repositories: safe-events-service-infra-tf
          permission-contents: write
          permission-pull-requests: write

      # The values file holds secrets and this repo's logs are public: never print it.
      - name: Open and merge the deploy PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE: ${{ inputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
          FILE: ${{ inputs.values_file }}
          REPO: safe-global/safe-events-service-infra-tf
        run: |
          set -euo pipefail
          TAG="${IMAGE%@*}"
          BRANCH="deploy/${ENVIRONMENT}/safe-events-service-${TAG}"
          TITLE="deploy(${ENVIRONMENT}): safe-events-service ${TAG}"

          main_sha() { gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha; }
          fetch_values() {
            gh api "repos/${REPO}/contents/${FILE}?ref=$1" > file.json
            jq -r .content file.json | base64 -d > values.yaml
            # yq exits 0 on an empty file and would write back a file with only the tag.
            yq -e '.fullnameOverride == "safe-events-service"' values.yaml > /dev/null
          }
          # Points the branch at $1 (main) and writes the new tag on top of it.
          write_branch() {
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$1" --silent 2>/dev/null \
              || gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="$1" -F force=true --silent
            yq '.image.tag = strenv(IMAGE)' values.yaml | base64 -w0 > content.b64
            gh api -X PUT "repos/${REPO}/contents/${FILE}" \
              -f message="$TITLE" \
              -F content=@content.b64 \
              -f sha="$(jq -r .sha file.json)" \
              -f branch="$BRANCH" \
              --silent
          }

          BASE=$(main_sha)
          fetch_values "$BASE"
          TOKEN=$(yq -r '.ingressApisix.routes[] | select(.name == "events-route-health") | .exprs[0].value' values.yaml)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "::error::No health route token in ${FILE}"; exit 1; }
          echo "::add-mask::${TOKEN}"
          printf '%s' "$TOKEN" > "${RUNNER_TEMP}/health-token"

          if [ "$(yq -r .image.tag values.yaml)" = "$IMAGE" ]; then
            echo "${ENVIRONMENT} already runs ${TAG}"
            exit 0
          fi
          write_branch "$BASE"
          PR_URL=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          [ -n "$PR_URL" ] || PR_URL=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" \
            --body "Automated deploy from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")

          # --admin uses safe-ci's ruleset bypass; without it the merge is briefly refused after the push.
          for attempt in $(seq 1 8); do
            gh pr merge "$PR_URL" --repo "$REPO" --squash --admin --delete-branch --subject "$TITLE" --body "" && break
            [ "$(gh pr view "$PR_URL" --repo "$REPO" --json state --jq .state)" = MERGED ] && break
            [ "$attempt" -eq 8 ] && { echo "::error::Could not merge ${PR_URL}"; exit 1; }
            sleep 20
            # main moved (another deploy or a values change): rebuild the branch on top of it.
            NEW=$(main_sha)
            if [ "$NEW" != "$BASE" ]; then
              BASE="$NEW"
              fetch_values "$BASE"
              write_branch "$BASE"
            fi
          done
          echo "Deployed ${TAG} to ${ENVIRONMENT}: ${PR_URL}"

      # Only the health route skips the Google login, and it needs the Datadog synthetic header.
      - name: Wait for the new version and check health
        env:
          IMAGE: ${{ inputs.image }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          TOKEN=$(cat "${RUNNER_TEMP}/health-token")
          get() {
            curl -sS -o body.json -w '%{http_code}' --max-time 10 \
              -H "X-Datadog-Synthetic-Token: ${TOKEN}" "${BASE_URL}$1" || echo 000
          }

          # Main builds all report the package.json version, so only releases can be told apart.
          TAG="${IMAGE%@*}"
          if [[ "$TAG" == v* ]]; then
            EXPECTED="${TAG#v}"
            for attempt in $(seq 1 60); do
              if [ "$(get /about)" = 200 ] && [ "$(jq -r '.version // empty' body.json)" = "$EXPECTED" ]; then
                echo "Version ${EXPECTED} is live"
                break
              fi
              [ "$attempt" -eq 60 ] && { echo "::error::${BASE_URL}/about did not report ${EXPECTED} within 15 minutes"; exit 1; }
              sleep 15
            done
          fi

          for attempt in $(seq 1 6); do
            [ "$(get /health/ready)" = 200 ] && { echo "Ready"; exit 0; }
            sleep 10
          done
          echo "::error::${BASE_URL}/health/ready did not return 200"
          exit 1
