# Copied from safe-global/github-reusable-workflows v2.4.41 (12d1f3f); that repo is
# private, so this public repo cannot call it. Re-sync by diffing a newer tag.
# =============================================================================
# REUSABLE: GitOps deploy — bump the Helm image tag in the infra repo
# =============================================================================
# The deploy IS a git commit that bumps the Helm image tag. This job mints a
# GitHub App token scoped to the separate Terraform/Helm repo, checks it out,
# rewrites `image.tag` in the environment's values file, and lands the change
# either as a direct push (default) or — when deploy_via_pr is true, for infra
# repos with a PR-only / signed-commits ruleset — as a branch + squash-merged
# PR. ArgoCD (watching that repo) reconciles the new tag onto the cluster
# automatically — CI never touches kubectl/helm.
#
# Optional production gate: wait for ArgoCD health + smoke-test the service;
# on failure, `git revert` the bump (ArgoCD rolls back to the previous tag).
# -----------------------------------------------------------------------------
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (staging | production). Also selects env-scoped secrets.
        type: string
        required: true
      image_tag:
        description: Immutable image tag to deploy (must already be pushed to the registry).
        type: string
        required: true
      infra_repo:
        description: owner/name of the Terraform/Helm/values repo (e.g. safe-global/my-service-infra).
        type: string
        required: true
      values_file:
        description: Path (within infra_repo) to the env values file to bump.
        type: string
        required: true
      image_tag_path:
        description: yq path to the image tag field inside values_file.
        type: string
        default: .image.tag
      deploy_via_pr:
        description: >-
          How the image-tag bump lands in infra_repo. false (default) = commit
          straight to the default branch (direct push) — the unchanged legacy
          behavior. true = push a deploy branch, open a PR and squash-merge it —
          required when the infra repo enforces a PR-only / signed-commits ruleset
          that rejects direct pushes to main. The PR path needs the app token
          exposed as GH_TOKEN (already wired into the bump step).
        type: boolean
        default: false
      argocd_app:
        description: ArgoCD Application name to wait on (optional; production gate).
        type: string
        default: ""
      health_url:
        description: URL to smoke-test after deploy (optional; production gate).
        type: string
        default: ""
      version_check_url:
        description: >-
          Optional JSON endpoint exposing a `.version` field (e.g. /api/v1/about/).
          After deploy, poll it until `.version` equals image_tag — confirms the
          new image actually rolled out. VPN-free alternative to the ArgoCD wait
          when the controller is unreachable (e.g. staging behind a separate VPN).
        type: string
        default: ""
      health_gate:
        description: >-
          Enable the full production gate: ArgoCD wait + smoke test + post-deploy
          checks. Set true for production only. For staging, set health_url
          without health_gate to get a non-rolling smoke test.
        type: boolean
        default: false
      auto_rollback:
        description: >-
          On a failed health gate, git-revert the image bump so ArgoCD rolls back
          to the previous tag. Only meaningful when health_gate is true. Set FALSE
          for services with forward-only DB migrations: reverting the image across
          a migration leaves code and schema mismatched and breaks the service —
          the safe recovery is to roll FORWARD, so the job fails loudly (no revert)
          and a human intervenes.
        type: boolean
        default: true
      aws_region:
        description: AWS region for Secrets Manager lookups (VPN config + ArgoCD token).
        type: string
        default: "eu-central-1"
      post_deploy_checks:
        description: >-
          Optional bash commands run after the smoke test (whenever provided, for
          staging and production). Any non-zero exit fails the job (and triggers
          rollback only when health_gate and auto_rollback are both true). Useful
          for service-specific checks such as API endpoint assertions.
          Example: |
            curl -fsS https://example.com/api/v1/chains/ | jq -e '.count > 0'
            curl -fsS https://example.com/api/v1/safe-apps/ | jq -e '.count > 0'
        type: string
        default: ""
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      gpg_private_key:
        description: GPG private key for signing the deploy commit (enterprise signed-commits rule).
        required: true
      gpg_passphrase:
        description: Passphrase for the GPG private key.
        required: true
      argocd_server:
        required: false
      argocd_token:
        required: false
      vpn_secret:
        description: AWS Secrets Manager secret name for the OpenVPN config file (to reach a VPN-gated ArgoCD).
        required: false
      aws_role_arn:
        description: IAM role ARN to assume via OIDC for Secrets Manager access (required when vpn_secret or argocd_token_secret is set).
        required: false
      argocd_token_secret:
        description: AWS Secrets Manager secret name for the ArgoCD API token (overrides argocd_token when set).
        required: false

# Serialise deploys per-environment so two pushes can't race the infra repo.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # secrets.* is not available in step if: conditions — derive booleans here
    # (secrets ARE available in job-level env) and test env._HAS_* in the steps.
    env:
      _HAS_VPN: ${{ secrets.vpn_secret != '' }}
      _HAS_ARN: ${{ secrets.aws_role_arn != '' }}
      _HAS_ARGOCD_SECRET: ${{ secrets.argocd_token_secret != '' }}
    steps:
      - name: Validate AWS inputs
        if: ${{ (env._HAS_VPN == 'true' || env._HAS_ARGOCD_SECRET == 'true') && env._HAS_ARN != 'true' }}
        run: |
          echo "::error::aws_role_arn is required when vpn_secret or argocd_token_secret is set"
          exit 1

      - name: Resolve infra repo name
        id: infra
        env:
          INFRA: ${{ inputs.infra_repo }}
        run: echo "name=${INFRA##*/}" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (scoped to infra repo)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.infra.outputs.name }}
          permission-contents: write
          # Needed only by the deploy_via_pr path, which opens a PR. Listing any
          # permission here drops every one not listed, so contents alone 403s.
          permission-pull-requests: write

      - name: Checkout infra repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          fetch-depth: 1
          persist-credentials: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          passphrase: ${{ secrets.gpg_passphrase }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_committer_name: 'GH Signer Bot'
          git_committer_email: 'gh-signer-bot@safe.global'

      - name: Bump image tag (yq) & deploy
        id: commit
        working-directory: infra
        env:
          # GH_TOKEN is only consumed by the PR path (gh pr create/merge); it is
          # harmless in the direct-push path, where git uses persisted creds.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VALUES_FILE: ${{ inputs.values_file }}
          TAG_PATH: ${{ inputs.image_tag_path }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VIA_PR: ${{ inputs.deploy_via_pr }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_VIA_PR" = "true" ]; then
            # ---- PR-based flow: infra repo requires PRs / signed commits -------
            # Bump on a deploy branch, open a PR and squash-merge it. ArgoCD then
            # reconciles the new tag. Each deploy leaves a merged PR in infra-tf,
            # enabling one-click GitHub reverts.
            REPO="${GITHUB_REPOSITORY##*/}"
            BRANCH="deploy/${ENVIRONMENT}/${REPO}-${IMAGE_TAG}"

            git checkout -b "$BRANCH"
            # mikefarah yq v4 is preinstalled on ubuntu-latest runners.
            yq -i "${TAG_PATH} = strenv(IMAGE_TAG)" "$VALUES_FILE"
            git add "$VALUES_FILE"
            if git diff --cached --quiet; then
              echo "Image tag already ${IMAGE_TAG} — nothing to deploy."
              exit 0
            fi
            git commit -m "deploy(${ENVIRONMENT}): ${REPO} ${IMAGE_TAG}"
            # --force handles re-runs of failed workflows where the branch already exists.
            # Deploy branches are ephemeral and only written by this workflow.
            git push --force origin "$BRANCH"

            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "deploy(${ENVIRONMENT}): ${REPO} ${IMAGE_TAG}" \
              --body "Automated deploy · [CI run #${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})")

            # --squash produces a single commit on main signed by GitHub web-flow (Verified badge).
            # Merge with --admin so the CLI actually exercises our ruleset bypass. By
            # default `gh pr merge` refuses a PR in a transient BLOCKED state — right after
            # the branch push the require_last_push_approval rule recomputes and the PR is
            # briefly blocked — even when the token is a bypass actor. That was the
            # intermittent "base branch policy prohibits the merge" (root cause confirmed by
            # GitHub Support). --admin does NOT require App admin permission; being on the
            # ruleset bypass list is enough — it just tells the CLI to use that bypass.
            # The loop now only rebases when infra main advanced (concurrent deploy).
            for attempt in $(seq 1 8); do
              if gh pr merge "$PR_URL" --squash --admin --delete-branch \
                   --subject "deploy(${ENVIRONMENT}): ${REPO} ${IMAGE_TAG}" \
                   --body ""; then
                break
              fi
              [ "$attempt" -eq 8 ] && { echo "::error::PR merge failed after 8 attempts. Open PR: ${PR_URL}"; exit 1; }
              echo "Merge attempt ${attempt} failed — waiting 20s for the branch policy to settle"
              sleep 20
              git fetch origin
              if ! git merge-base --is-ancestor origin/main HEAD; then
                echo "infra main advanced — rebasing deploy branch"
                git rebase origin/main || { git rebase --abort; echo "::error::Rebase conflict — manual resolution required. Open PR: ${PR_URL}"; exit 1; }
                git push --force-with-lease origin "$BRANCH"
              fi
            done

            # mergeCommit.oid can lag a few seconds after gh pr merge returns.
            MERGE_SHA=""
            for attempt in 1 2 3 4 5; do
              MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // empty')
              [ -n "$MERGE_SHA" ] && break
              sleep 2
            done
            if [ -z "$MERGE_SHA" ]; then
              # Fallback: find the commit by title — safe under concurrent unrelated deploys.
              git fetch origin main
              MERGE_SHA=$(git log origin/main --grep "^deploy(${ENVIRONMENT}): ${REPO} ${IMAGE_TAG}$" -n1 --format=%H)
            fi
            if [ -z "$MERGE_SHA" ]; then
              echo "::error::Could not resolve merge SHA — rollback not possible if health gate fails."
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
            echo "Deployed ${IMAGE_TAG} to ${ENVIRONMENT} — ${PR_URL}"
          else
            # ---- Direct-push flow (default; existing behavior, unchanged) ------
            # mikefarah yq v4 is preinstalled on ubuntu-latest runners.
            yq -i "${TAG_PATH} = strenv(IMAGE_TAG)" "$VALUES_FILE"
            git add "$VALUES_FILE"
            if git diff --cached --quiet; then
              echo "Image tag already ${IMAGE_TAG} — nothing to deploy."
              exit 0
            fi
            git commit -m "deploy(${ENVIRONMENT}): ${GITHUB_REPOSITORY##*/} ${IMAGE_TAG}"
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                echo "Deployed ${IMAGE_TAG} to ${ENVIRONMENT}."
                exit 0
              fi
              echo "push rejected (attempt ${attempt}) — rebasing on infra HEAD"
              git pull --rebase
            done
            echo "::error::Failed to push deploy commit after 3 attempts."
            exit 1
          fi

      - name: Configure AWS credentials
        if: ${{ env._HAS_ARN == 'true' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Fetch ArgoCD token from Secrets Manager
        if: ${{ env._HAS_ARGOCD_SECRET == 'true' }}
        id: argocd-secrets
        run: |
          set -euo pipefail
          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.argocd_token_secret }}" \
            --query SecretString --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Start VPN
        if: ${{ env._HAS_VPN == 'true' }}
        # Best-effort: the VPN only enables the deeper ArgoCD wait. If it fails,
        # don't kill the deploy — the version-poll + smoke + post-deploy checks
        # below (all public, no VPN) are the real gate.
        continue-on-error: true
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.vpn_secret }}" \
            --query SecretString --output text > /tmp/vpn.ovpn
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn
          sudo openvpn --config /tmp/vpn.ovpn --daemon \
            --log /tmp/openvpn.log --writepid /tmp/openvpn.pid
          # openvpn runs as root, so its log/pid are root-owned — read them with sudo.
          for i in $(seq 1 30); do
            sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null && break
            sleep 2
          done
          sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log \
            || { sudo cat /tmp/openvpn.log 2>/dev/null || true; echo "::error::VPN failed to initialize"; exit 1; }
          # Route the private infra zone through the VPC resolver over the tunnel
          # so the private ArgoCD server resolves. Raw `openvpn --daemon` brings up
          # tun0 but does NOT wire its pushed DNS into systemd-resolved, so
          # *.infra.safe.global has no route and the ArgoCD wait fails with "no
          # such host". Set it explicitly. 10.0.0.2 is the shared-infra VPC
          # resolver. Best-effort like the rest of this step.
          sudo resolvectl dns tun0 10.0.0.2
          sudo resolvectl domain tun0 "~infra.safe.global"

      - name: Wait for version rollout
        if: ${{ inputs.version_check_url != '' }}
        env:
          EXPECTED: ${{ inputs.image_tag }}
          URL: ${{ inputs.version_check_url }}
        run: |
          set -euo pipefail
          # Poll the service's version endpoint until it reports the tag we just
          # deployed — proof that ArgoCD reconciled the NEW image (not the old
          # pods). VPN-free readiness check for a GitOps rollout.
          [ -n "$EXPECTED" ] || { echo "::error::empty image_tag — cannot verify rollout"; exit 1; }
          for i in $(seq 1 40); do
            DEPLOYED=$(curl -fsS "$URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || true)
            echo "attempt ${i}/40 — deployed=${DEPLOYED:-<none>} expected=${EXPECTED}"
            [ "$DEPLOYED" = "$EXPECTED" ] && { echo "Rollout confirmed: ${EXPECTED}"; exit 0; }
            sleep 15
          done
          echo "::error::Timed out (10m) waiting for ${URL} to report version ${EXPECTED}"
          exit 1

      - name: Wait for ArgoCD sync & health
        if: ${{ inputs.health_gate && inputs.argocd_app != '' }}
        # Best-effort deeper check (needs the VPN). A failure here — including the
        # VPN being down — must NOT fail the deploy; the version-poll + smoke +
        # post-deploy checks are the gate. This step's failure is surfaced but
        # non-blocking.
        continue-on-error: true
        env:
          ARGOCD_SERVER: ${{ secrets.argocd_server }}
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-secrets.outputs.token || secrets.argocd_token }}
        run: |
          set -euo pipefail
          if [ -z "${ARGOCD_SERVER:-}" ] || [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
            echo "ArgoCD credentials not provided — skipping explicit wait, relying on smoke test."
            exit 0
          fi
          # Pin the CLI version (don't pull a moving "latest" at runtime).
          ARGOCD_VERSION="v2.13.3"
          curl -sSL -o /tmp/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /tmp/argocd
          /tmp/argocd app wait "${{ inputs.argocd_app }}" \
            --health --sync --timeout 300 --grpc-web

      - name: Smoke test
        if: ${{ inputs.health_url != '' }}
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${{ inputs.health_url }}"

      - name: Custom post-deploy checks
        if: ${{ inputs.post_deploy_checks != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.post_deploy_checks }}

      - name: Roll back on failed health gate
        if: ${{ failure() && steps.commit.outputs.pushed == 'true' && inputs.health_gate && inputs.auto_rollback }}
        working-directory: infra
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOY_VIA_PR: ${{ inputs.deploy_via_pr }}
        run: |
          set -euo pipefail
          echo "::warning::Health gate failed — reverting ${DEPLOY_SHA}; ArgoCD will roll back."
          # Revert by explicit SHA (not HEAD) and retry the push: the infra repo may
          # have advanced during the multi-minute health gate, making a bare push a
          # non-fast-forward. Without this, the rollback would silently fail.
          if [ "$DEPLOY_VIA_PR" = "true" ]; then
            # After gh pr merge --delete-branch the working tree is left on the now-deleted
            # deploy branch. Explicitly switch to main before reverting.
            git checkout main
            git pull --rebase origin main
          else
            git pull --rebase
          fi
          git revert --no-edit "$DEPLOY_SHA"
          for attempt in 1 2 3; do
            # On success still exit non-zero so the bad release is surfaced as a failure.
            if git push; then exit 1; fi
            echo "rollback push rejected (attempt ${attempt}) — rebasing"
            git pull --rebase
          done
          echo "::error::Rollback push failed after 3 attempts — manual intervention required."
          exit 1

      - name: Stop VPN
        if: ${{ always() && env._HAS_VPN == 'true' }}
        run: |
          # pid/log are root-owned (openvpn ran via sudo) — kill and clean up with sudo.
          [ -f /tmp/openvpn.pid ] && sudo kill "$(sudo cat /tmp/openvpn.pid)" 2>/dev/null || true
          sudo rm -f /tmp/vpn.ovpn /tmp/openvpn.pid /tmp/openvpn.log
