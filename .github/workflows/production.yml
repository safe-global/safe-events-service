name: Production

# Builds and publishes release images. There is no deploy job yet: production
# is still deployed from legacy-safe-argocd-mgmt by a manual digest bump.
on:
  release:
    # `released` skips pre-releases, as the old pipeline did.
    types: [released]
  # Run it on a tag, e.g. `gh workflow run production.yml --ref v1.6.0`. Taking the
  # tag as text instead would check out a ref from outside the default branch.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this on a release tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag ${TAG} does not look like vX.Y.Z."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # A dispatch can target any tag, so test what is actually shipping.
  ci:
    needs: prepare
    uses: ./.github/workflows/_ci-node.yml
    with:
      package_manager: pnpm
      check_scripts: "format:check typecheck lint:check"
      test_scripts: "test:cov test:e2e:cov"
      postgres_image: "postgres:16"
      postgres_db: test
      rabbitmq_image: "rabbitmq:alpine"
      env_file: .env.sample

  db-migrations:
    needs: prepare
    uses: ./.github/workflows/_db-migrations.yml

  build:
    needs: [ci, db-migrations, prepare]
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: ghcr.io/safe-global/safe-events-service
      image_tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.tag }}
      platforms: linux/amd64,linux/arm64

  # Release versions only; the moving `latest` and `staging` tags are retired.
  dockerhub:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Copy the release image to Docker Hub
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "docker.io/safeglobal/safe-events-service:${TAG}" \
            "ghcr.io/safe-global/safe-events-service@${DIGEST}"
