name: Production
on:
  # `released`, not `published`: promoting a pre-release fires only `released`,
  # so under `published` that release would never deploy.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy again with its existing image (no rebuild), e.g. v1.6.0
        type: string
        required: true

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'${TAG}' is not a vX.Y.Z tag"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - name: Check the tag is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/${TAG}" origin/main \
            || { echo "::error::${TAG} is not on main"; exit 1; }
      # A manual run redeploys the image built at release. The builder cannot build a tag
      # from a run triggered on main.
      - name: GHCR login
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get the release image digest
        id: digest
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ghcr.io/safe-global/safe-events-service:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # Tests the release commit. A manual run deploys an image that was already built and
  # tested at release, so it skips the tests.
  ci:
    needs: [prepare]
    if: github.event_name == 'release'
    # ci.yml's image job asks for these permissions. It is skipped here, but a
    # caller must still grant every permission a called job asks for.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: [prepare, ci]
    if: github.event_name == 'release'
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write  # Sign provenance attestations and cache entries
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: |
        BUILD_COMMIT=${{ github.sha }}
      cache: true
      cache-mode: max
      meta-images: ghcr.io/safe-global/safe-events-service
      meta-tags: |
        type=raw,value=${{ needs.prepare.outputs.tag }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [prepare, build]
    # build is skipped on a manual run, which deploys the digest found by prepare.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    permissions: {}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image: ${{ needs.prepare.outputs.tag }}@${{ needs.build.outputs.digest || needs.prepare.outputs.digest }}
      values_file: apps/safe-events-service/values-production.yaml
      base_url: https://api.safe.global/internal/events
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
