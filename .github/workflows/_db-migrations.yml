name: _db-migrations

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out. Empty = the ref that triggered the caller.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: cp .env.sample .env
      - run: pnpm run build
      # The script sets -ux but not -e, so a failed migration:run would pass.
      - run: bash -e ./scripts/db_run_migrations.sh
      - run: bash ./scripts/db_check_migrations.sh
