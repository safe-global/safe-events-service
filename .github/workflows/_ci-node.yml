# Copied from safe-global/github-reusable-workflows v2.4.41 (12d1f3f); that repo is
# private, so this public repo cannot call it. Re-sync by diffing a newer tag.
# =============================================================================
# REUSABLE: CI quality gate for Node services (checks · build · tests)
# =============================================================================
# The Node counterpart to _ci-python.yml: an `on: workflow_call` building block
# so the PR gate and the trunk (push-to-main) pipeline share one definition.
# Pure quality checks, it never builds or pushes images.
#
# Script names are inputs rather than fixed, because the Node services do not
# agree on them. Across safe-balance-service, safe-events-service,
# safe-billing-service, safe-network-service, safe-fee-service and
# safe-client-gateway the same check appears as `lint`, `lint:check` and
# `lint-check`, and as `format:check` and `format-check`. Rather than rename
# scripts in six repos owned by three teams, each caller passes what it has.
# An empty input skips that step.
#
# All three service containers always start. A service image can come from an
# input, and each one here does, but a service cannot be conditionally omitted:
# `services:` takes no `if:`. Counting the six callers' current CI: Postgres is
# needed by all six, RabbitMQ by three (balance, events, client-gateway) and
# Redis by two (balance, client-gateway). So all three are declared, and the
# cost is Redis and RabbitMQ startup for the callers that do not use them.
# Splitting into per-combination jobs would duplicate the whole job body,
# which is worse.
#
# Example, safe-balance-service. Its four current CI jobs (lint, unit, e2e,
# integration) collapse into the two jobs here:
#
#   jobs:
#     ci:
#       uses: safe-global/github-reusable-workflows/.github/workflows/_ci-node.yml@<sha>
#       with:
#         node_version: "24.11.0"
#         package_manager: yarn
#         check_scripts: "lint"
#         test_scripts: "test test:e2e test:integration"
#         postgres_db: balance_service
#
# A pnpm caller passes `package_manager: pnpm` and its own script names, for
# example `check_scripts: "format:check lint:check typecheck"`. A service whose
# tests read `.env` adds `env_file: .env.sample`; `coverage: coveralls` uploads
# every test script's report as one Coveralls report.
# -----------------------------------------------------------------------------
name: _ci-node

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version passed to setup-node. Example "24.11.0" or "22.x".
        type: string
        default: "24.x"
      package_manager:
        description: Package manager driving install, cache and setup. One of yarn, pnpm, npm.
        type: string
        default: "pnpm"
      check_scripts:
        description: >-
          Space-separated package scripts run without service containers.
          Example: "format:check lint typecheck". Empty skips the checks job.
        type: string
        default: ""
      build_script:
        description: Package script run before the tests. Empty skips the build.
        type: string
        default: "build"
      test_scripts:
        description: >-
          Space-separated package scripts run with service containers available.
          Example: "test:unit test:integration". Empty skips the tests job.
        type: string
        default: ""
      postgres_image:
        description: Postgres service image.
        type: string
        default: "postgres:16-alpine"
      postgres_db:
        description: Database created in the Postgres service container.
        type: string
        default: "postgres"
      redis_image:
        description: Redis service image.
        type: string
        default: "redis:7-alpine"
      rabbitmq_image:
        description: RabbitMQ service image.
        type: string
        default: "rabbitmq:3.13-management-alpine"
      ref:
        description: Git ref to check out. Empty = the ref that triggered the caller.
        type: string
        default: ""
      env_file:
        description: >-
          Committed file copied to `.env` in both jobs, for services whose config
          reads `.env`. Example ".env.sample". Empty skips.
        type: string
        default: ""
      coverage:
        description: Coverage upload after the tests. One of "" (none) or "coveralls".
        type: string
        default: ""
      coverage_file:
        description: >-
          Report each test script writes. It is moved aside after every script,
          because scripts commonly share one path and would overwrite each other.
        type: string
        default: "coverage/lcov.info"

permissions:
  contents: read

jobs:
  checks:
    if: inputs.check_scripts != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - name: Copy env file
        if: inputs.env_file != ''
        env:
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::env_file ${ENV_FILE} does not exist"
            exit 1
          fi
          cp "$ENV_FILE" .env

      # Corepack must be enabled before setup-node, so its cache detection sees
      # the yarn version from packageManager. The runner ships yarn 1.x, which
      # refuses to run a project pinned to yarn 4.
      - name: Enable corepack
        if: inputs.package_manager == 'yarn'
        run: corepack enable

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: inputs.package_manager == 'pnpm'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            yarn) yarn install --immutable ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            *) echo "::error::unsupported package_manager: $PACKAGE_MANAGER"; exit 1 ;;
          esac

      - name: Run checks
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          CHECK_SCRIPTS: ${{ inputs.check_scripts }}
        run: |
          set -euo pipefail
          for script in $CHECK_SCRIPTS; do
            echo "::group::${PACKAGE_MANAGER} run ${script}"
            "$PACKAGE_MANAGER" run "$script"
            echo "::endgroup::"
          done

  tests:
    if: inputs.test_scripts != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres_db }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ inputs.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: ${{ inputs.rabbitmq_image }}
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl await_startup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Validate coverage input
        if: inputs.coverage != '' && inputs.coverage != 'coveralls'
        env:
          COVERAGE: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          echo "::error::coverage must be empty or coveralls, got: ${COVERAGE}"
          exit 1

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - name: Copy env file
        if: inputs.env_file != ''
        env:
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::env_file ${ENV_FILE} does not exist"
            exit 1
          fi
          cp "$ENV_FILE" .env

      - name: Enable corepack
        if: inputs.package_manager == 'yarn'
        run: corepack enable

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: inputs.package_manager == 'pnpm'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            yarn) yarn install --immutable ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            *) echo "::error::unsupported package_manager: $PACKAGE_MANAGER"; exit 1 ;;
          esac

      - name: Build
        if: inputs.build_script != ''
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          "$PACKAGE_MANAGER" run "$BUILD_SCRIPT"

      - name: Run tests
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          TEST_SCRIPTS: ${{ inputs.test_scripts }}
          COVERAGE: ${{ inputs.coverage }}
          COVERAGE_FILE: ${{ inputs.coverage_file }}
        run: |
          set -euo pipefail
          n=0
          for script in $TEST_SCRIPTS; do
            echo "::group::${PACKAGE_MANAGER} run ${script}"
            "$PACKAGE_MANAGER" run "$script"
            echo "::endgroup::"
            if [ -n "$COVERAGE" ]; then
              if [ ! -f "$COVERAGE_FILE" ]; then
                echo "::error::${script} did not write ${COVERAGE_FILE}"
                exit 1
              fi
              n=$((n + 1))
              mkdir -p coverage-reports
              mv "$COVERAGE_FILE" "coverage-reports/${n}-${script//[^A-Za-z0-9]/-}.info"
            fi
          done

      - name: List coverage reports
        id: reports
        if: inputs.coverage == 'coveralls'
        run: |
          set -euo pipefail
          mkdir -p coverage-reports
          echo "files=$(find coverage-reports -name '*.info' | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # A Coveralls outage must not fail CI; coverage is informational.
      - name: Upload coverage to Coveralls
        if: inputs.coverage == 'coveralls'
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ github.token }}
          files: ${{ steps.reports.outputs.files }}
          fail-on-error: false
