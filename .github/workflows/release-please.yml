name: Release Please

on:
  workflow_run:
    workflows: ["Devstaging"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    uses: safe-global/github-reusable-workflows/.github/workflows/_release.yml@fd3a0dfa5c655241ec335fdd2af954ab42e044c0 # unreleased, github-reusable-workflows#70
    with:
      release_type: node
      auto_merge_release: false
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
