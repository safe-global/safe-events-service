name: CI
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [released]

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm run format:check

  typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm run typecheck

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm run lint:check

  db-migrations:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: cp .env.sample .env
      - run: pnpm run build
      - run: bash ./scripts/db_run_migrations.sh
      - run: bash ./scripts/db_check_migrations.sh

  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl await_startup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        task: ['test:cov', 'test:e2e:cov']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: cp .env.sample .env
      - run: pnpm run build
      - run: pnpm run ${{matrix.task}}
      - name: Coveralls Parallel
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-${{ matrix.task }}
          parallel: true

  tests-finish:
    permissions:
      contents: read
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  docker-publish:
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.action == 'released')
    needs:
      - format
      - typecheck
      - lint
      - tests
    runs-on: ubuntu-latest
    outputs:
      main_tag: ${{ steps.main.outputs.tag }}
      main_digest: ${{ steps.push-main.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve main tag
        id: main
        if: github.ref == 'refs/heads/main'
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Push main
        id: push-main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/safe-global/safe-events-service:${{ steps.main.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy Tag
        if: (github.event_name == 'release' && github.event.action == 'released')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/safe-global/safe-events-service:${{ github.event.release.tag_name }}
            ghcr.io/safe-global/safe-events-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-devstaging:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main'
    # Two merges in a row would otherwise race on the same file.
    concurrency:
      group: deploy-devstaging
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: safe-global
          repositories: safe-events-service-infra-tf
      # The file holds secrets and this repo's logs are public: never print it.
      - name: Point devstaging at the new image
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.docker-publish.outputs.main_tag }}
          IMAGE: ${{ needs.docker-publish.outputs.main_tag }}@${{ needs.docker-publish.outputs.main_digest }}
          REPO: safe-global/safe-events-service-infra-tf
          FILE: apps/safe-events-service/values-staging.yaml
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/contents/${FILE}" > file.json
          jq -r .content file.json | base64 -d > values.yaml
          # yq exits 0 on an empty file and would write back a file with only the tag.
          yq -e '.fullnameOverride == "safe-events-service"' values.yaml > /dev/null
          yq '.image.tag = strenv(IMAGE)' values.yaml | base64 -w0 > content.b64
          gh api -X PUT "repos/${REPO}/contents/${FILE}" \
            -f message="chore: Deploy safe-events-service ${TAG} to devstaging" \
            -F content=@content.b64 \
            -f sha="$(jq -r .sha file.json)" \
            -f branch=main \
            --silent
